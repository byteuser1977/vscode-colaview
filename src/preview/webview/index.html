<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' vscode-webview-resource:; script-src 'unsafe-inline' vscode-webview-resource:; font-src vscode-webview-resource: data:; img-src file: data: vscode-webview-resource: https:; connect-src https: vscode-webview-resource:;">
    <link rel="stylesheet" href="colamd.css" id="colamd-css">
    <!-- 变量名对齐 ColaMD 2.7.9 主题契约: --bg-color / --text-color / --border-color 等 -->
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-color, #fff) !important;
            color: var(--text-color, #24292f) !important;
        }
        /* CodeMirror 6 编辑器容器 */
        #editor {
            min-height: 100vh;
        }
        /* CodeMirror 焦点轮廓去除 */
        #editor.cm-editor.cm-focused {
            outline: none;
        }
        #editor .cm-content {
            padding: 20px 40px 40px;
            max-width: 780px;
            margin: 0 auto;
            min-height: calc(100vh - 60px);
            cursor: default;
        }
        #editor .cm-editor.cm-focused > .cm-scroller > .cm-content,
        #editor .cm-editor.cm-focused > .cm-scroller > .cm-gutters {
            cursor: default;
        }
        /* 隐藏光标和选区高亮（只读预览） */
        #editor .cm-cursor,
        #editor .cm-selectionBackground,
        #editor.cm-focused .cm-selectionBackground,
        #editor .cm-content ::selection {
            opacity: 0 !important;
        }
        /* CodeMirror 6 默认不换行，Markdown 预览必须换行 */
        #editor .cm-content {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        /* 滚动容器 */
        #editor .cm-scroller {
            overflow: auto;
        }
        /* mermaid 图要画在代码块的深色底上（和 ColaMD 一致）：图表配色是按
           --code-block-bg 推出来的，浮在浅色页面上时整块底色和那边对不上。 */
        #editor .cm-md-mermaid {
            background: var(--code-block-bg);
            border-radius: 6px;
            padding: 0.8em 1em;
        }

        /* ── Context Menu ── */
        .ctx-menu {
            position: fixed;
            z-index: 9999;
            min-width: 180px;
            background: var(--bg-color, #fff);
            color: var(--text-color, #24292f);
            border: 1px solid var(--border-color, #d0d7de);
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            padding: 4px 0;
            font-size: 13px;
            line-height: 1.5;
            user-select: none;
        }
        .ctx-menu-item {
            position: relative;
            padding: 6px 16px;
            cursor: pointer;
            white-space: nowrap;
        }
        .ctx-menu-item:hover {
            background: var(--code-bg, rgba(0,0,0,0.06));
            color: var(--link-color, #0969da);
        }
        .ctx-menu-disabled {
            color: var(--text-muted, #8b949e);
            pointer-events: none;
        }
        .ctx-menu-active {
            font-weight: 600;
        }
        .ctx-menu-active::before {
            content: '✓';
            position: absolute;
            left: 4px;
        }
        .ctx-menu-separator {
            height: 1px;
            margin: 4px 0;
            background: var(--border-color, #d0d7de);
        }
        .ctx-menu-has-submenu {
            padding-right: 28px;
        }
        .ctx-menu-has-submenu::after {
            content: '▸';
            position: absolute;
            right: 10px;
            color: var(--text-muted, #8b949e);
        }
        .ctx-menu-submenu {
            position: absolute;
            top: -4px;
            left: 100%;
            min-width: 160px;
            background: var(--bg-color, #fff);
            color: var(--text-color, #24292f);
            border: 1px solid var(--border-color, #d0d7de);
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            padding: 4px 0;
            display: none;
        }
        .ctx-menu-has-submenu:hover > .ctx-menu-submenu {
            display: block;
        }
    </style>
</head>
<body>
    <div id="editor"></div>
    <script src="app.js"></script>
</body>
</html>
